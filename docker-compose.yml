# Production deployment on one server: Postgres + Skyload (web and worker) + Caddy for HTTPS.
# Easiest path: run ./deploy/install.sh, which writes .env and starts everything.
# Manual path: cp .env.example .env, fill it in (including DOMAIN), then `docker compose up -d --build`.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: skyload
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: skyload
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U skyload']
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://skyload:${POSTGRES_PASSWORD}@db:5432/skyload
      APP_URL: https://${DOMAIN:?set DOMAIN in .env}
      ROLE: all
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '3000'
    ports:
      # Incoming BitTorrent peers. Optional, but downloads are faster when reachable.
      - '6881:6881/tcp'
      - '6881:6881/udp'
    volumes:
      - downloads:/data
    stop_grace_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # To run the website and the torrent worker on different machines, deploy the
  # same image twice with ROLE=web and ROLE=worker, both pointing at one Postgres.

volumes:
  pgdata:
  downloads:
  caddy_data:
  caddy_config:
